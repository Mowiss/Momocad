<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMOtocad - Dessin de Plan Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1e1e1e; color: #fff; font-family: sans-serif; }
        canvas { display: block; cursor: crosshair; }
        .tool-btn { transition: all 0.2s; }
        .tool-btn.active {
            background-color: #3b82f6;
            color: white;
            border-color: #2563eb;
        }
        .logo-font {
            font-family: "Arial Black", "Arial Bold", sans-serif;
            font-weight: 900;
        }
        .tool-group {
            border: 1px solid #374151;
            padding: 4px;
            border-radius: 8px;
            background-color: #1f2937;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    </style>
</head>
<body class="flex flex-col h-screen relative">

    <!-- Écran de chargement pour l'export haute résolution -->
    <div id="print-loader" class="hidden absolute inset-0 bg-gray-900 bg-opacity-80 z-[100] flex flex-col items-center justify-center backdrop-blur-sm">
        <svg class="animate-spin h-12 w-12 text-blue-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <h2 class="text-xl font-bold text-white">Génération Haute Résolution (300 DPI)</h2>
        <p class="text-sm text-gray-300 mt-2">Calcul des vecteurs en cours, veuillez patienter...</p>
    </div>

    <!-- Header / Ruban -->
    <header class="bg-gray-800 p-3 border-b border-gray-700 shadow-md z-10 flex justify-between items-center text-gray-200">
        <div class="flex items-center">
            <h1 class="text-3xl logo-font pl-2 mr-4 tracking-tighter italic select-none">
                <span class="text-gray-400">MOMO</span><span class="text-blue-500">cad</span>
            </h1>
            
            <div class="tool-group flex items-center space-x-1 mr-4">
                <button id="btn-undo" class="tool-btn w-8 h-8 flex items-center justify-center bg-gray-700 border border-gray-600 rounded hover:bg-gray-600" title="Annuler (Ctrl+Z)" onclick="undo()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
                </button>
                <button id="btn-redo" class="tool-btn w-8 h-8 flex items-center justify-center bg-gray-700 border border-gray-600 rounded hover:bg-gray-600" title="Rétablir (Ctrl+Y)" onclick="redo()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path></svg>
                </button>
            </div>

            <div class="tool-group flex items-center space-x-2 px-2 mr-4">
                <div class="flex items-center space-x-1" title="Calque actif">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-gray-400"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                    <select id="active-layer-select" class="bg-gray-700 text-white border border-gray-600 rounded px-1 py-1 text-sm outline-none w-24 truncate" onchange="changeActiveLayer()"></select>
                </div>
                <button class="tool-btn w-8 h-8 flex items-center justify-center bg-gray-700 border border-gray-600 rounded hover:bg-gray-600" title="Gérer les calques" onclick="openLayerModal()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
                <div class="w-px h-5 bg-gray-600 mx-1"></div>
                <button id="btn-snap-settings" class="tool-btn w-8 h-8 flex items-center justify-center bg-gray-700 border border-gray-600 rounded hover:bg-gray-600 text-yellow-500" title="Paramètres d'accrochage" onclick="openSnapModal()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 15l7-7 7 7"></path><circle cx="12" cy="12" r="1" fill="currentColor"></circle></svg>
                </button>
            </div>

            <div class="tool-group flex items-center space-x-3 px-3">
                <div class="flex items-center space-x-1" title="Couleur">
                    <label class="text-xs text-gray-400">Coul.</label>
                    <input type="color" id="prop-color" value="#ffffff" class="w-8 h-8 bg-transparent border-0 cursor-pointer rounded" onchange="updateSelectedProperties()">
                </div>
                <div class="flex items-center space-x-1" title="Type de trait">
                    <label class="text-xs text-gray-400">Type</label>
                    <select id="prop-dash" class="bg-gray-700 text-white border border-gray-600 rounded px-1 py-1 text-sm outline-none font-mono" onchange="updateSelectedProperties()">
                        <option value="solid">────────</option><option value="dashed">─ ─ ─ ─</option><option value="center">─ · ─ · ─</option>
                    </select>
                </div>
                <div class="flex items-center space-x-1" title="Épaisseur / Taille">
                    <label class="text-xs text-gray-400">Taille</label>
                    <input type="number" id="prop-width" value="1" min="0.1" step="0.1" max="100" class="w-12 bg-gray-700 text-white border border-gray-600 rounded px-1 py-1 text-sm outline-none text-center" onchange="updateSelectedProperties()">
                </div>
            </div>
        </div>

        <div class="tool-group flex items-center space-x-1 pr-1">
            <button id="btn-fullscreen" class="tool-btn w-9 h-9 flex items-center justify-center bg-gray-700 border border-gray-600 rounded hover:bg-gray-600 text-gray-200" title="Plein Écran" onclick="toggleFullScreen()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
            </button>
            <button id="btn-save" class="tool-btn w-9 h-9 flex items-center justify-center bg-gray-700 border border-gray-600 rounded hover:bg-gray-600 text-blue-400" title="Sauvegarder en JSON" onclick="saveToJSON()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            </button>
            <button id="btn-load" class="tool-btn w-9 h-9 flex items-center justify-center bg-gray-700 border border-gray-600 rounded hover:bg-gray-600 text-orange-400" title="Charger un JSON" onclick="document.getElementById('file-input').click()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
            </button>
            <input type="file" id="file-input" class="hidden" accept=".json" onchange="loadFromJSON(event)">
            <button id="btn-cartouche" class="tool-btn w-9 h-9 flex items-center justify-center bg-gray-700 border border-gray-600 rounded hover:bg-gray-600 text-yellow-400" title="Éditer le Cartouche" onclick="openCartoucheModal()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
            </button>
            <button id="btn-print" class="tool-btn w-9 h-9 flex items-center justify-center bg-gray-700 border border-gray-600 rounded hover:bg-gray-600 text-white" title="Mode Impression (ESPACE pour pivoter)" onclick="setMode('print')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <aside class="w-16 bg-gray-800 border-r border-gray-700 flex flex-col items-center py-4 space-y-4 shadow-md z-10 overflow-y-auto">
            <!-- Bloc Manipulation -->
            <div class="tool-group flex flex-col space-y-2">
                <button id="btn-select-box" class="tool-btn w-10 h-10 flex items-center justify-center bg-gray-700 border border-gray-600 rounded hover:bg-gray-600 text-pink-400" title="Sélection" onclick="setMode('select-box')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"><rect x="3" y="3" width="18" height="18" rx="2"></rect></svg></button>
                <button id="btn-move" class="tool-btn w-10 h-10 flex items-center justify-center bg-gray-700 border border-gray-600 rounded hover:bg-gray-600 text-purple-400" title="Déplacer" onclick="setMode('move')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="5 9 2 12 5 15"></polyline><polyline points="9 5 12 2 15 5"></polyline><polyline points="15 19 12 22 9 19"></polyline><polyline points="19 9 22 12 19 15"></polyline><line x1="2" y1="12" x2="22" y2="12"></line><line x1="12" y1="2" x2="12" y2="22"></line></svg></button>
                <button id="btn-rotate" class="tool-btn w-10 h-10 flex items-center justify-center bg-gray-700 border border-gray-600 rounded hover:bg-gray-600 text-indigo-400" title="Rotation (↻)" onclick="setMode('rotate')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg></button>
                <button id="btn-trim" class="tool-btn w-10 h-10 flex items-center justify-center bg-gray-700 border border-gray-600 rounded hover:bg-gray-600 text-green-300" title="Ajuster (Trim)" onclick="setMode('trim')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4L3 20"></path><path d="M12 4v16" stroke-dasharray="2 2"></path></svg></button>
                <button id="btn-extend" class="tool-btn w-10 h-10 flex items-center justify-center bg-gray-700 border border-gray-600 rounded hover:bg-gray-600 text-blue-300" title="Prolonger (Extend)" onclick="setMode('extend')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3v18"></path><path d="M3 12h10"></path><path d="M9 8l4 4-4 4"></path></svg></button>
                <div class="w-8 border-t border-gray-700 mx-auto"></div>
                <button id="btn-cut" class="tool-btn w-10 h-10 flex items-center justify-center bg-gray-700 border border-gray-600 rounded hover:bg-gray-600 text-red-400" title="Couper (Ctrl+X)" onclick="cutSelection()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><line x1="20" y1="4" x2="8.12" y2="15.88"></line><line x1="14.47" y1="14.48" x2="20" y2="20"></line><line x1="8.12" y1="8.12" x2="12" y2="12"></line></svg></button>
                <button id="btn-copy" class="tool-btn w-10 h-10 flex items-center justify-center bg-gray-700 border border-gray-600 rounded hover:bg-gray-600 text-gray-300" title="Copier (Ctrl+C)" onclick="copySelection()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>
                <button id="btn-paste" class="tool-btn w-10 h-10 flex items-center justify-center bg-gray-700 border border-gray-600 rounded hover:bg-gray-600 text-gray-300" title="Coller (Ctrl+V)" onclick="pasteSelection()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg></button>
            </div>

            <!-- Bloc Création -->
            <div class="tool-group flex flex-col space-y-2">
                <button id="btn-line" class="tool-btn active w-10 h-10 flex items-center justify-center bg-gray-700 border border-gray-600 rounded hover:bg-gray-600" title="Ligne" onclick="setMode('line')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="5" x2="5" y2="19"></line></svg></button>
                <button id="btn-circle" class="tool-btn w-10 h-10 flex items-center justify-center bg-gray-700 border border-gray-600 rounded hover:bg-gray-600 text-pink-300" title="Cercle" onclick="setMode('circle')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"></circle></svg></button>
                <button id="btn-arc" class="tool-btn w-10 h-10 flex items-center justify-center bg-gray-700 border border-gray-600 rounded hover:bg-gray-600 text-cyan-300" title="Arc (Centre, Début, Fin)" onclick="setMode('arc')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 18 0"></path></svg></button>
                <button id="btn-poly" class="tool-btn w-10 h-10 flex items-center justify-center bg-gray-700 border border-gray-600 rounded hover:bg-gray-600 text-teal-400" title="Polygone" onclick="setMode('poly')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l9 4.5v11L12 22l-9-4.5v-11z"></path></svg></button>
                <button id="btn-text" class="tool-btn w-10 h-10 flex items-center justify-center bg-gray-700 border border-gray-600 rounded hover:bg-gray-600 text-yellow-200" title="Texte" onclick="setMode('text')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg></button>
                <button id="btn-dim" class="tool-btn w-10 h-10 flex items-center justify-center bg-gray-700 border border-gray-600 rounded hover:bg-gray-600 text-amber-400" title="Cotation" onclick="setMode('dim')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="2" y1="12" x2="22" y2="12"></line><polyline points="5 8 2 12 5 16"></polyline><polyline points="19 8 22 12 19 16"></polyline><line x1="2" y1="8" x2="2" y2="16"></line><line x1="22" y1="8" x2="22" y2="16"></line></svg></button>
            </div>
            
            <div class="w-8 border-t border-gray-600 my-2"></div>
            <button id="btn-scale" class="tool-btn w-10 h-10 flex items-center justify-center bg-gray-700 border border-gray-600 rounded hover:bg-gray-600 text-green-400" title="Échelle" onclick="openScaleModal()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="10" rx="1"></rect><line x1="6" y1="7" x2="6" y2="12"></line><line x1="10" y1="7" x2="10" y2="10"></line><line x1="14" y1="7" x2="14" y2="12"></line><line x1="18" y1="7" x2="18" y2="10"></line></svg></button>
        </aside>

        <main class="flex-1 relative" id="canvas-container">
            <canvas id="cadCanvas"></canvas>
            <div id="text-input-modal" class="hidden absolute bg-gray-800 p-4 rounded-lg shadow-2xl border border-gray-600 z-50 w-64">
                <input type="text" id="text-content" class="w-full bg-gray-700 text-white border border-gray-600 rounded px-2 py-1 outline-none focus:border-blue-500 mb-3" placeholder="Votre texte ici...">
                <div class="flex justify-end space-x-2">
                    <button class="px-2 py-1 text-xs rounded bg-gray-600 text-white" onclick="closeTextModal()">Annuler</button>
                    <button class="px-2 py-1 text-xs rounded bg-blue-600 text-white" onclick="applyText()">Valider</button>
                </div>
            </div>
            
            <!-- NOUVEAU : Popup de propriétés géométriques -->
            <div id="properties-popup" class="hidden absolute bottom-6 right-6 bg-gray-800/95 border border-gray-600 text-gray-200 p-4 rounded-lg shadow-2xl text-xs z-40 pointer-events-none min-w-[180px] backdrop-blur-sm">
                <h4 class="font-bold text-white mb-2 border-b border-gray-600 pb-1" id="prop-popup-title">Propriétés</h4>
                <div id="prop-popup-content" class="flex flex-col space-y-1.5 text-[13px]"></div>
            </div>
        </main>
    </div>

    <!-- Modales -->
    <div id="scale-modal" class="hidden absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-gray-800 p-6 rounded-lg shadow-2xl border border-gray-600 z-50 w-80">
        <h3 class="text-lg font-bold text-white mb-4">Étalonnage de l'échelle</h3>
        <p class="text-sm text-gray-300 mb-4">Équivalence d'un carré de grille :</p>
        <div class="flex items-center justify-center space-x-3 mb-6"><span class="text-white font-bold whitespace-nowrap">1 carré = </span><input type="number" id="modal-scale-value" class="w-20 bg-gray-700 text-white border border-gray-600 rounded px-3 py-2 outline-none focus:border-blue-500" value="10"><select id="modal-scale-unit" class="bg-gray-700 text-white border border-gray-600 rounded px-2 py-2 outline-none focus:border-blue-500"><option value="m">m</option><option value="cm">cm</option><option value="mm" selected>mm</option></select></div>
        <div class="flex justify-end space-x-3"><button class="px-4 py-2 rounded bg-gray-600 hover:bg-gray-500 text-white transition" onclick="closeScaleModal()">Annuler</button><button class="px-4 py-2 rounded bg-green-600 hover:bg-green-500 text-white transition" onclick="applyScale()">Appliquer</button></div>
    </div>
    <div id="cartouche-modal" class="hidden absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-gray-800 p-6 rounded-lg shadow-2xl border border-gray-600 z-50 w-96">
        <h3 class="text-lg font-bold text-white mb-4">Informations du Cartouche</h3>
        <div class="flex flex-col space-y-3 mb-6">
            <div><label class="block text-xs text-gray-400 mb-1">Nom du plan</label><input type="text" id="cartouche-plan" class="w-full bg-gray-700 text-white border border-gray-600 rounded px-2 py-1 outline-none"></div>
            <div><label class="block text-xs text-gray-400 mb-1">Nom du client</label><input type="text" id="cartouche-client" class="w-full bg-gray-700 text-white border border-gray-600 rounded px-2 py-1 outline-none"></div>
            <div><label class="block text-xs text-gray-400 mb-1">Dessinateur</label><input type="text" id="cartouche-draftsman" class="w-full bg-gray-700 text-white border border-gray-600 rounded px-2 py-1 outline-none"></div>
            <div><label class="block text-xs text-gray-400 mb-1">Logo de l'entreprise</label><input type="file" id="cartouche-logo" accept="image/*" class="w-full text-sm text-gray-400"></div>
        </div>
        <div class="flex justify-end space-x-3"><button class="px-4 py-2 rounded bg-gray-600 hover:bg-gray-500 text-white transition" onclick="closeCartoucheModal()">Annuler</button><button class="px-4 py-2 rounded bg-blue-600 hover:bg-blue-500 text-white transition" onclick="applyCartouche()">Valider</button></div>
    </div>
    <div id="layer-modal" class="hidden absolute top-16 left-64 bg-gray-800 p-4 rounded-lg shadow-2xl border border-gray-600 z-50 w-80">
        <div class="flex justify-between items-center mb-4"><h3 class="text-lg font-bold text-white">Gestionnaire de Calques</h3><button class="text-gray-400 hover:text-white" onclick="closeLayerModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></div>
        <div id="layers-list" class="flex flex-col space-y-2 mb-4 max-h-60 overflow-y-auto custom-scrollbar pr-2"></div>
        <div class="flex items-center space-x-2 border-t border-gray-700 pt-3"><input type="text" id="new-layer-name" class="flex-1 bg-gray-700 text-white border border-gray-600 rounded px-2 py-1 outline-none focus:border-blue-500" placeholder="Nouveau calque..."><button class="px-3 py-1 rounded bg-blue-600 hover:bg-blue-500 text-white text-sm" onclick="addLayer()">Ajouter</button></div>
    </div>
    <div id="snap-modal" class="hidden absolute top-16 left-96 bg-gray-800 p-4 rounded-lg shadow-2xl border border-gray-600 z-50 w-64">
        <div class="flex justify-between items-center mb-4"><h3 class="text-lg font-bold text-white">Points d'accroche</h3><button class="text-gray-400 hover:text-white" onclick="closeSnapModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></div>
        <div class="flex flex-col space-y-3">
            <label class="flex items-center space-x-3 cursor-pointer group"><input type="checkbox" id="snap-end" checked class="w-4 h-4 rounded bg-gray-700 border-gray-600 text-blue-500" onchange="toggleSnapSetting('endpoint')"><span class="text-sm text-gray-200 group-hover:text-white">Extrémités</span></label>
            <label class="flex items-center space-x-3 cursor-pointer group"><input type="checkbox" id="snap-mid" checked class="w-4 h-4 rounded bg-gray-700 border-gray-600 text-blue-500" onchange="toggleSnapSetting('midpoint')"><span class="text-sm text-gray-200 group-hover:text-white">Milieux</span></label>
            <label class="flex items-center space-x-3 cursor-pointer group"><input type="checkbox" id="snap-center" checked class="w-4 h-4 rounded bg-gray-700 border-gray-600 text-blue-500" onchange="toggleSnapSetting('center')"><span class="text-sm text-gray-200 group-hover:text-white">Centres</span></label>
            <label class="flex items-center space-x-3 cursor-pointer group"><input type="checkbox" id="snap-inter" checked class="w-4 h-4 rounded bg-gray-700 border-gray-600 text-blue-500" onchange="toggleSnapSetting('intersection')"><span class="text-sm text-gray-200 group-hover:text-white">Croisements / Intersections</span></label>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('cadCanvas');
        const ctx = canvas.getContext('2d');

        // --- ÉTATS ---
        let camera = { x: 0, y: 0, zoom: 1 };
        let isPanning = false, lastPanX = 0, lastPanY = 0;
        let mode = 'line';
        let isDrawing = false, startX = 0, startY = 0, currentX = 0, currentY = 0;
        let currentX_screen = 0, currentY_screen = 0;
        let typedInput = "";
        let dimStep = 0, dimP1 = null, dimP2 = null;
        let currentPolygon = [], currentSnap = null;
        let arcStep = 0, arcCenter = null, arcP1 = null, arcRadius = 0, arcStartAngle = 0;

        const SNAP_DIST = 15;
        let selectedShapes = [], moveBasePoint = null, isMovingObjects = false;
        let rotateCenter = null, rotateStartAngle = 0, isRotatingObjects = false;
        let clipboard = [], pasteOffset = 0;
        const GRID_SIZE = 50; 
        
        let unitsPerSquare = 10, currentUnit = 'mm';
        
        let shapes = [], dimensionTextsToDraw = [], pendingTextPos = null;
        let printOrientation = 'landscape'; 
        let cartoucheData = { logo: null, planName: '', clientName: '', draftsmanName: '' };
        const PRINT_SCALES = [1, 2, 5, 10, 25, 50, 100, 150, 200, 500];
        let currentPrintScale = 50;

        let layers = [{ id: 'layer-0', name: '0 - Murs', visible: true }, { id: 'layer-1', name: '1 - Mobilier', visible: true }, { id: 'layer-2', name: '2 - Cotations', visible: true }];
        let activeLayerId = 'layer-0';
        let snapSettings = { endpoint: true, midpoint: true, center: true, intersection: true };

        // --- CACHE POUR OPTIMISATION ---
        let cachedSnapPoints = null;
        function invalidateCache() { cachedSnapPoints = null; }

        // --- UI MODALES ---
        function openTextModal(wx, wy, sx, sy) { pendingTextPos = {wx, wy}; const m = document.getElementById('text-input-modal'); m.style.left = Math.min(sx + 10, window.innerWidth - 280) + 'px'; m.style.top = Math.min(sy + 10, window.innerHeight - 150) + 'px'; m.classList.remove('hidden'); document.getElementById('text-content').value = ""; document.getElementById('text-content').focus(); }
        function applyText() { const c = document.getElementById('text-content').value; if (c.trim() && pendingTextPos) { shapes.push({ type: 'text', layerId: activeLayerId, x: pendingTextPos.wx, y: pendingTextPos.wy, content: c, color: document.getElementById('prop-color').value, size: (parseFloat(document.getElementById('prop-width').value) || 1) * 20 }); saveState(); draw(); } closeTextModal(); }
        function closeTextModal() { document.getElementById('text-input-modal').classList.add('hidden'); pendingTextPos = null; }
        function closeLayerModal() { document.getElementById('layer-modal').classList.add('hidden'); }
        function closeScaleModal() { document.getElementById('scale-modal').classList.add('hidden'); }
        function closeCartoucheModal() { document.getElementById('cartouche-modal').classList.add('hidden'); }
        function closeSnapModal() { document.getElementById('snap-modal').classList.add('hidden'); }
        function openLayerModal() { closeSnapModal(); document.getElementById('layer-modal').classList.remove('hidden'); updateLayerUI(); }
        function openScaleModal() { document.getElementById('scale-modal').classList.remove('hidden'); }
        function openSnapModal() { closeLayerModal(); document.getElementById('snap-modal').classList.remove('hidden'); }
        function openCartoucheModal() { document.getElementById('cartouche-modal').classList.remove('hidden'); document.getElementById('cartouche-plan').value = cartoucheData.planName || ""; document.getElementById('cartouche-client').value = cartoucheData.clientName || ""; document.getElementById('cartouche-draftsman').value = cartoucheData.draftsmanName || ""; }
        function toggleSnapSetting(type) { snapSettings[type] = document.getElementById('snap-' + (type === 'endpoint' ? 'end' : type === 'midpoint' ? 'mid' : type === 'intersection' ? 'inter' : type)).checked; invalidateCache(); draw(); }

        // --- GESTION DES CALQUES ---
        function generateId() { return 'layer-' + Math.random().toString(36).substr(2, 9); }
        function updateLayerUI() {
            const select = document.getElementById('active-layer-select');
            if (select) { select.innerHTML = ''; layers.forEach(l => { let opt = document.createElement('option'); opt.value = l.id; opt.textContent = l.name; if (l.id === activeLayerId) opt.selected = true; select.appendChild(opt); }); }
            const list = document.getElementById('layers-list');
            if (list) {
                list.innerHTML = '';
                layers.forEach(l => {
                    let div = document.createElement('div'); div.className = `flex items-center justify-between p-2 rounded border ${l.id === activeLayerId ? 'bg-gray-700 border-blue-500' : 'bg-gray-800 border-gray-600'}`;
                    div.innerHTML = `<div class="flex items-center space-x-3 flex-1 overflow-hidden"><button onclick="toggleLayerVis('${l.id}')" class="${l.visible ? 'text-blue-400' : 'text-gray-500 hover:text-gray-400'}">${l.visible ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>' : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>'}</button><span class="text-sm text-gray-200 cursor-pointer truncate flex-1" onclick="setActiveLayer('${l.id}')">${l.name}</span></div><button onclick="deleteLayer('${l.id}')" class="text-gray-500 hover:text-red-400 ml-2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>`;
                    list.appendChild(div);
                });
            }
        }
        function changeActiveLayer() { activeLayerId = document.getElementById('active-layer-select').value; let l = layers.find(layer => layer.id === activeLayerId); if (l && !l.visible) l.visible = true; invalidateCache(); updateLayerUI(); draw(); }
        function setActiveLayer(id) { activeLayerId = id; let l = layers.find(layer => layer.id === activeLayerId); if (l && !l.visible) l.visible = true; invalidateCache(); updateLayerUI(); draw(); }
        function toggleLayerVis(id) { let l = layers.find(layer => layer.id === id); if (l) l.visible = !l.visible; invalidateCache(); updateLayerUI(); draw(); }
        function addLayer() { const input = document.getElementById('new-layer-name'); const name = input.value.trim(); if (name) { const newId = generateId(); layers.push({ id: newId, name: name, visible: true }); activeLayerId = newId; input.value = ''; saveState(); updateLayerUI(); } }
        function deleteLayer(id) { if (layers.length <= 1) { alert("Dernier calque."); return; } if (confirm("Supprimer ce calque ?")) { layers = layers.filter(l => l.id !== id); shapes = shapes.filter(s => (s.layerId || 'layer-0') !== id); selectedShapes = selectedShapes.filter(s => (s.layerId || 'layer-0') !== id); if (activeLayerId === id) activeLayerId = layers[0].id; saveState(); updateLayerUI(); draw(); } }

        // --- MATH INTERSECTIONS ET ARCS ---
        function isAngleBetween(target, start, end) {
            const PI2 = Math.PI * 2;
            let t = (target % PI2 + PI2) % PI2, s = (start % PI2 + PI2) % PI2, e = (end % PI2 + PI2) % PI2;
            if (s < e) return t >= s && t <= e;
            return t >= s || t <= e;
        }

        function getIntersectionLines(x1, y1, x2, y2, x3, y3, x4, y4) {
            let det = (x2 - x1) * (y4 - y3) - (y2 - y1) * (x4 - x3); if (det === 0) return null;
            let t = ((x3 - x1) * (y4 - y3) - (y3 - y1) * (x4 - x3)) / det, u = ((x3 - x1) * (y2 - y1) - (y3 - y1) * (x2 - x1)) / det;
            if (t >= 0 && t <= 1 && u >= 0 && u <= 1) return { x: x1 + t * (x2 - x1), y: y1 + t * (y2 - y1) }; return null;
        }

        function getIntersectionLineCircle(x1, y1, x2, y2, cx, cy, r) {
            let dx = x2 - x1, dy = y2 - y1, fx = x1 - cx, fy = y1 - cy;
            let a = dx * dx + dy * dy, b = 2 * (fx * dx + fy * dy), c = (fx * fx + fy * fy) - r * r;
            let disc = b * b - 4 * a * c; let res = [];
            if (disc >= 0) {
                disc = Math.sqrt(disc); let t1 = (-b - disc) / (2 * a), t2 = (-b + disc) / (2 * a);
                if (t1 >= 0 && t1 <= 1) res.push({ x: x1 + t1 * dx, y: y1 + t1 * dy });
                if (t2 >= 0 && t2 <= 1) res.push({ x: x1 + t2 * dx, y: y1 + t2 * dy });
            } return res;
        }

        function getIntersectionCircles(c1x, c1y, r1, c2x, c2y, r2) {
            let dx = c2x - c1x, dy = c2y - c1y, d = Math.hypot(dx, dy);
            if (d > r1 + r2 || d < Math.abs(r1 - r2) || d === 0) return [];
            let a = (r1 * r1 - r2 * r2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, r1 * r1 - a * a));
            let x2 = c1x + a * (dx / d), y2 = c1y + a * (dy / d);
            return [{ x: x2 + h * (dy / d), y: y2 - h * (dx / d) }, { x: x2 - h * (dy / d), y: y2 + h * (dx / d) }];
        }

        function getSegments(s) {
            if (s.type === 'line' || s.type === 'dim') return [{ x1: s.x1, y1: s.y1, x2: s.x2, y2: s.y2 }];
            if (s.type === 'poly') { let segs = []; for (let i = 0; i < s.points.length; i++) { let p1 = s.points[i], p2 = s.points[(i + 1) % s.points.length]; segs.push({ x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y }); } return segs; }
            return [];
        }

        function getInterPoints(s1, s2) {
            let pts = [], segs1 = getSegments(s1), segs2 = getSegments(s2);
            if (segs1.length > 0 && segs2.length > 0) { segs1.forEach(a => segs2.forEach(b => { let p = getIntersectionLines(a.x1, a.y1, a.x2, a.y2, b.x1, b.y1, b.x2, b.y2); if (p) pts.push(p); })); } 
            else if (segs1.length > 0 && (s2.type === 'circle' || s2.type === 'arc')) {
                segs1.forEach(a => { let res = getIntersectionLineCircle(a.x1, a.y1, a.x2, a.y2, s2.x, s2.y, s2.r); if (s2.type === 'arc') res = res.filter(p => isAngleBetween(Math.atan2(p.y - s2.y, p.x - s2.x), s2.startAngle, s2.endAngle)); pts.push(...res); });
            } 
            else if (segs2.length > 0 && (s1.type === 'circle' || s1.type === 'arc')) {
                segs2.forEach(a => { let res = getIntersectionLineCircle(a.x1, a.y1, a.x2, a.y2, s1.x, s1.y, s1.r); if (s1.type === 'arc') res = res.filter(p => isAngleBetween(Math.atan2(p.y - s1.y, p.x - s1.x), s1.startAngle, s1.endAngle)); pts.push(...res); });
            } 
            else if ((s1.type === 'circle' || s1.type === 'arc') && (s2.type === 'circle' || s2.type === 'arc')) {
                let res = getIntersectionCircles(s1.x, s1.y, s1.r, s2.x, s2.y, s2.r);
                if (s1.type === 'arc') res = res.filter(p => isAngleBetween(Math.atan2(p.y - s1.y, p.x - s1.x), s1.startAngle, s1.endAngle));
                if (s2.type === 'arc') res = res.filter(p => isAngleBetween(Math.atan2(p.y - s2.y, p.x - s2.x), s2.startAngle, s2.endAngle));
                pts.push(...res);
            }
            return pts;
        }

        function getAllIntersections() {
            let pts = [], vis = shapes.filter(s => { let l = layers.find(lx => lx.id === (s.layerId || 'layer-0')); return l && l.visible; });
            for (let i = 0; i < vis.length; i++) { for (let j = i + 1; j < vis.length; j++) pts.push(...getInterPoints(vis[i], vis[j])); }
            return pts;
        }

        function applyRotationToShape(s, cx, cy, angleRad) {
            const cos = Math.cos(angleRad), sin = Math.sin(angleRad);
            const rot = (x, y) => ({ x: (cos * (x - cx)) - (sin * (y - cy)) + cx, y: (sin * (x - cx)) + (cos * (y - cy)) + cy });

            if (s.type === 'line') {
                let p1 = rot(s.x1, s.y1), p2 = rot(s.x2, s.y2);
                s.x1 = p1.x; s.y1 = p1.y; s.x2 = p2.x; s.y2 = p2.y;
            } else if (s.type === 'circle') {
                let p = rot(s.x, s.y); s.x = p.x; s.y = p.y;
            } else if (s.type === 'arc') {
                let p = rot(s.x, s.y); s.x = p.x; s.y = p.y;
                s.startAngle += angleRad; s.endAngle += angleRad;
            } else if (s.type === 'poly') {
                s.points.forEach(pt => { let p = rot(pt.x, pt.y); pt.x = p.x; pt.y = p.y; });
            } else if (s.type === 'text') {
                let p = rot(s.x, s.y); s.x = p.x; s.y = p.y;
                s.angle = (s.angle || 0) + angleRad;
            } else if (s.type === 'dim') {
                let p1 = rot(s.x1, s.y1), p2 = rot(s.x2, s.y2), po = rot(s.ox, s.oy);
                s.x1 = p1.x; s.y1 = p1.y; s.x2 = p2.x; s.y2 = p2.y; s.ox = po.x; s.oy = po.y;
            }
        }

        function drawDimension(tx, p1, p2, po, sel = false) {
            let dx = p2.x-p1.x, dy = p2.y-p1.y, dist = Math.hypot(dx, dy); if (dist < 0.01) return;
            tx.strokeStyle = sel ? '#ec4899' : '#f59e0b'; tx.lineWidth = (sel?3:1)/camera.zoom;
            let ux = dx/dist, uy = dy/dist, nx = -uy, ny = ux, vOffX = po.x-p1.x, vOffY = po.y-p1.y, off = vOffX*nx + vOffY*ny;
            let c1 = {x:p1.x+nx*off, y:p1.y+ny*off}, c2 = {x:p2.x+nx*off, y:p2.y+ny*off};
            tx.setLineDash([]); tx.globalAlpha = 0.6; tx.beginPath();
            tx.moveTo(p1.x+nx*(off*0.1), p1.y+ny*(off*0.1)); tx.lineTo(c1.x+nx*(off>0?5:-5)/camera.zoom, c1.y+ny*(off>0?5:-5)/camera.zoom);
            tx.moveTo(p2.x+nx*(off*0.1), p2.y+ny*(off*0.1)); tx.lineTo(c2.x+nx*(off>0?5:-5)/camera.zoom, c2.y+ny*(off>0?5:-5)/camera.zoom);
            tx.stroke(); tx.globalAlpha = 1.0; tx.beginPath(); tx.moveTo(c1.x, c1.y); tx.lineTo(c2.x, c2.y); tx.stroke();
            let t=5/camera.zoom; const dt=(p)=>{ tx.beginPath(); tx.moveTo(p.x-(ux+nx)*t, p.y-(uy+ny)*t); tx.lineTo(p.x+(ux+nx)*t, p.y+(uy+ny)*t); tx.stroke(); };
            dt(c1); dt(c2); dimensionTextsToDraw.push({ text: calculateRealDistance(dist), worldX: (c1.x+c2.x)/2, worldY: (c1.y+c2.y)/2 });
        }

        // --- CORE GEOMETRY & SNAP ---
        function screenToWorld(sx, sy) { return { x: (sx - camera.x) / camera.zoom, y: (sy - camera.y) / camera.zoom }; }
        function worldToScreen(wx, wy) { return { x: wx * camera.zoom + camera.x, y: wy * camera.zoom + camera.y }; }
        function calculateRealDistance(pxDist) { 
            let real = (pxDist/GRID_SIZE)*unitsPerSquare; 
            if (currentUnit === 'm' && real < 1) return (real*100).toFixed(1) + " cm";
            if (currentUnit === 'mm') return Math.round(real) + " mm";
            return real.toFixed(2) + " " + currentUnit; 
        }

        function getSnapPoints() {
            if (cachedSnapPoints) return cachedSnapPoints;
            let pts = [];
            for (const s of shapes) {
                let layer = layers.find(l => l.id === (s.layerId || 'layer-0')); if (layer && !layer.visible) continue;
                if (snapSettings.endpoint) { if (s.type === 'line' || s.type === 'dim') pts.push({x: s.x1, y: s.y1}, {x: s.x2, y: s.y2}); else if (s.type === 'poly') s.points.forEach(p => pts.push({x: p.x, y: p.y})); else if (s.type === 'text') pts.push({x: s.x, y: s.y}); else if (s.type === 'arc') { pts.push({x: s.x + Math.cos(s.startAngle)*s.r, y: s.y + Math.sin(s.startAngle)*s.r}); pts.push({x: s.x + Math.cos(s.endAngle)*s.r, y: s.y + Math.sin(s.endAngle)*s.r}); } }
                if (snapSettings.midpoint) { if (s.type === 'line' || s.type === 'dim') pts.push({x: (s.x1+s.x2)/2, y: (s.y1+s.y2)/2}); else if (s.type === 'poly') { for (let i=0; i<s.points.length; i++) { let p1=s.points[i], p2=s.points[(i+1)%s.points.length]; pts.push({x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2}); } } else if (s.type === 'arc') { let mid = s.startAngle < s.endAngle ? (s.startAngle + s.endAngle)/2 : (s.startAngle + s.endAngle + 2*Math.PI)/2; pts.push({x: s.x + Math.cos(mid)*s.r, y: s.y + Math.sin(mid)*s.r}); } }
                if (snapSettings.center && (s.type === 'circle' || s.type === 'arc')) pts.push({x: s.x, y: s.y});
            }
            if (snapSettings.intersection) pts.push(...getAllIntersections());
            cachedSnapPoints = pts;
            return pts;
        }

        function findSnap(mx, my) {
            let pts = getSnapPoints(), sd = SNAP_DIST/camera.zoom, bd = sd, bp = null;
            for (let p of pts) { let d = Math.hypot(p.x - mx, p.y - my); if (d < bd) { bd = d; bp = p; } }
            return bp;
        }

        function isPointInRect(px, py, rx, ry, rw, rh) {
            let xMin = Math.min(rx, rx + rw), xMax = Math.max(rx, rx + rw), yMin = Math.min(ry, ry + rh), yMax = Math.max(ry, ry + rh);
            return px >= xMin && px <= xMax && py >= yMin && py <= yMax;
        }

        function findShapeAt(wx, wy) {
            let tol = 10/camera.zoom, p = { x: wx, y: wy };
            for (let i = shapes.length-1; i >= 0; i--) {
                let s = shapes[i], l = layers.find(lx => lx.id === (s.layerId || 'layer-0')); if (l && !l.visible) continue;
                if (s.type === 'line') { let l2 = Math.pow(s.x2-s.x1,2)+Math.pow(s.y2-s.y1,2); if (l2 === 0) continue; let t = Math.max(0, Math.min(1, ((p.x-s.x1)*(s.x2-s.x1)+(p.y-s.y1)*(s.y2-s.y1))/l2)); if (Math.hypot(p.x-(s.x1+t*(s.x2-s.x1)), p.y-(s.y1+t*(s.y2-s.y1))) < tol) return s; }
                else if (s.type === 'dim') {
                    let dx = s.x2-s.x1, dy = s.y2-s.y1, dist = Math.hypot(dx, dy); if (dist < 0.01) continue;
                    let ux = dx/dist, uy = dy/dist, nx = -uy, ny = ux, vOffX = s.ox-s.x1, vOffY = s.oy-s.y1, off = vOffX*nx + vOffY*ny;
                    let c1x = s.x1+nx*off, c1y = s.y1+ny*off, c2x = s.x2+nx*off, c2y = s.y2+ny*off;
                    let l2 = Math.pow(c2x-c1x,2)+Math.pow(c2y-c1y,2); if (l2 === 0) continue;
                    let t = Math.max(0, Math.min(1, ((p.x-c1x)*(c2x-c1x)+(p.y-c1y)*(c2y-c1y))/l2));
                    if (Math.hypot(p.x-(c1x+t*(c2x-c1x)), p.y-(c1y+t*(c2y-c1y))) < tol) return s;
                }
                else if (s.type === 'circle') { let d = Math.hypot(p.x-s.x, p.y-s.y); if (Math.abs(d-s.r) < tol) return s; }
                else if (s.type === 'arc') { let d = Math.hypot(p.x-s.x, p.y-s.y); if (Math.abs(d-s.r) < tol) { let a = Math.atan2(p.y-s.y, p.x-s.x); if (isAngleBetween(a, s.startAngle, s.endAngle)) return s; } }
                else if (s.type === 'poly') { for(let j=0; j<s.points.length; j++){ let p1 = s.points[j], p2 = s.points[(j+1)%s.points.length]; let l2 = Math.pow(p2.x-p1.x,2)+Math.pow(p2.y-p1.y,2); if (l2 === 0) continue; let t = Math.max(0, Math.min(1, ((p.x-p1.x)*(p2.x-p1.x)+(p.y-p1.y)*(p2.y-p1.y))/l2)); if (Math.hypot(p.x-(p1.x+t*(p2.x-p1.x)), p.y-(p1.y+t*(p2.y-p1.y))) < tol) return s; } }
                else if (s.type === 'text') { ctx.font = s.size + "px Arial"; let w = ctx.measureText(s.content).width; if (wx >= s.x && wx <= s.x + w && wy <= s.y && wy >= s.y - s.size) return s; }
            } return null;
        }

        function extendShapeAt(mx, my) {

            else if ((e.key === 'Delete' || e.key === 'Backspace') && selectedShapes.length > 0) { shapes = shapes.filter(s => !selectedShapes.includes(s)); selectedShapes = []; saveState(); draw(); }
        });

        canvas.addEventListener('dblclick', (e) => { if (mode === 'poly' && isDrawing && currentPolygon.length > 2) { shapes.push({ type: 'poly', layerId: activeLayerId, points: [...currentPolygon], color: document.getElementById('prop-color').value, dash: document.getElementById('prop-dash').value, width: parseFloat(document.getElementById('prop-width').value) || 1, hatch: false }); isDrawing = false; currentPolygon = []; typedInput = ""; saveState(); draw(); } });
        canvas.addEventListener('wheel', (e) => { 
            e.preventDefault(); const r = canvas.getBoundingClientRect(); let sx = e.clientX-r.left, sy = e.clientY-r.top, wp = screenToWorld(sx, sy); 
            if (mode === 'print') { 
                const um = currentUnit === 'mm' ? unitsPerSquare/1000 : (currentUnit === 'cm' ? unitsPerSquare/100 : unitsPerSquare); 
                let s = (um*12)/(camera.zoom*0.297), ci = 0, md = Infinity; 
                for (let i=0; i<PRINT_SCALES.length; i++) { let d = Math.abs(PRINT_SCALES[i]-s); if (d < md) { md = d; ci = i; } } 
                if (e.deltaY < 0) ci = Math.max(0, ci-1); else ci = Math.min(PRINT_SCALES.length-1, ci+1); 
                currentPrintScale = PRINT_SCALES[ci]; camera.zoom = (um*12)/(currentPrintScale*0.297); 
            } else { 
                let zf = 1.1; if (e.deltaY < 0) camera.zoom *= zf; else camera.zoom /= zf; camera.zoom = Math.max(0.01, Math.min(camera.zoom, 50)); 
            } 
            camera.x = sx - wp.x * camera.zoom; camera.y = sy - wp.y * camera.zoom; draw(); 
        });

        window.onload = () => { updateLayerUI(); resizeCanvas(); saveState(); };
        function resizeCanvas() { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; draw(); }
        window.addEventListener('resize', resizeCanvas);
    </script>
</body>
</html>
