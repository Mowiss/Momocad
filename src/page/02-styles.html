/* Momo, aide de chantier */

body.v3on #mc-momo, body.v3on #mt-dock, body.v3on #mc-mini { z-index:61 !important; }
/* le chapeau dépasse toujours de la bande de commande, même quand elle passe sur deux lignes */
#mc-momo, #mt-dock { bottom: max(0px, calc(var(--mc-bot, 40px) - 40px)) !important; } body.v3on #command-bar { z-index:63 !important; }

#mc-hint { position:absolute; top:-6px; right:-10px; background:#eab308; color:#111827; font-weight:900; font-size:12px; border-radius:10px; padding:0 6px; line-height:18px; }
#mc-root.open #mc-hint { display:none; }
/* réduit : il réfléchit = engrenage qui tourne dans une bulle bleue ; il a répondu = « ! » blanc dans une bulle rouge */
#mc-hint.busy { background:#2563eb; color:#fff; padding:0; width:20px; height:20px; line-height:20px; text-align:center; box-shadow:0 0 0 2px #1e3a8a66; }

@keyframes mcPing { 0%,100% { box-shadow:0 0 0 0 #dc262699; } 50% { box-shadow:0 0 0 6px #dc262600; } }
#mc-panel { display:none; pointer-events:auto; position:absolute; left:10px; bottom:118px; z-index:62; width:380px; max-width:calc(100vw - 200px); height:min(520px, calc(100vh - 260px)); flex-direction:column; background:#111827f7; border:1.5px solid #eab308; border-radius:14px; box-shadow:0 12px 32px #000a; color:#e5e7eb; font-size:13.5px; line-height:1.5; overflow:hidden; }

@keyframes mo-spin { 0% { transform: rotateY(0) scale(1); filter:drop-shadow(0 0 0 #f9a8d4); } 45% { transform: rotateY(540deg) scale(1.25); filter:drop-shadow(0 0 10px #f9a8d4) brightness(1.4); } 100% { transform: rotateY(720deg) scale(1); filter:drop-shadow(0 4px 6px #0008); } }

@keyframes mo-spark { 0% { transform:translate(-50%,-50%) scale(0) rotate(0); opacity:1; } 40% { transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(120deg); opacity:1; } 100% { transform:translate(calc(-50% + var(--dx) * 1.3), calc(-50% + var(--dy) + 24px)) scale(.2) rotate(260deg); opacity:0; } }
