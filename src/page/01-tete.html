        // Manifeste toujours intégré (icônes comprises) : un seul fichier index.html suffit, plus de manifest.json ni de dossier icons.
        if (location.protocol.startsWith('http')) addEmbeddedManifest();
        // Le navigateur propose l'installation : on garde l'événement et on affiche le bouton.
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            window.__installPrompt = e;
            const b = document.getElementById('btn-install'); if (b) b.classList.remove('hidden');
        });
        window.addEventListener('appinstalled', () => {
            window.__installPrompt = null;
            const b = document.getElementById('btn-install'); if (b) b.classList.add('hidden');
        });
        async function installApp() {
            const e = window.__installPrompt; if (!e) return;
            e.prompt();
            await e.userChoice;
            window.__installPrompt = null;
            document.getElementById('btn-install').classList.add('hidden');
        }
